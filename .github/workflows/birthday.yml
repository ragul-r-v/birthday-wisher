name: Birthday Wisher

on:
workflow_dispatch:

jobs:
send-birthday-mails:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - run: pip install -r requirements.txt

  - env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
    run: python main.py
```
