name: Birthday Wisher

on:
  workflow_dispatch:
  schedule:
    - cron: '27 0 * * *'  # 5:57 AM IST (~6:00 AM IST)

jobs:
  send-birthday-mails:
    runs-on: ubuntu-latest

    env:
      TZ: 'Asia/Kolkata'

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode birthdays CSV
        env:
          BIRTHDAYS_CSV: ${{ secrets.BIRTHDAYS_CSV_DATA || secrets.BIRTHDAYS_CSV || vars.BIRTHDAYS_CSV_DATA || vars.BIRTHDAYS_CSV }}
        run: python decode_csv.py

      - name: Run unit tests
        run: python -m unittest test_main.py

      - name: Run birthday wisher
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || 't.v.malathi2001@gmail.com' }}
        run: python main.py