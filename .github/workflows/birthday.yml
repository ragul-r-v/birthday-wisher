name: Birthday Wisher

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST

jobs:
  send-birthday-mails:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create birthdays CSV
        run: |
          cat << 'CSVEOF' > birthdays.csv
          ${{ secrets.BIRTHDAYS_CSV }}
          CSVEOF
          echo "CSV lines: $(wc -l < birthdays.csv)"

      - name: Run birthday wisher
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py